<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-label="Recruiter scanning players">
  <style>
    .rb-fill { fill: #3a3a3e; }
    .rb-barbg { fill: #232326; }
    .rb-bar { fill: #3f3f45; }
    .rb-bar--top { fill: #0070f3; }
    .rb-lens { animation: rb-move 10s ease-in-out infinite, rb-fade 10s linear infinite; }
    .rb-star { opacity: 0; transform-box: fill-box; transform-origin: center; animation: rb-star 10s ease-out infinite; animation-delay: 6s; }
    .rb-p1 .rb-fill { animation: rb-lit 10s linear infinite; }
    .rb-p2 .rb-fill { animation: rb-lit 10s linear infinite; animation-delay: 2s; }
    .rb-p3 .rb-fill { animation: rb-lit 10s linear infinite; animation-delay: 4s; }
    .rb-p4 .rb-fill { animation: rb-lit 10s linear infinite; animation-delay: 6s; }
    .rb-p5 .rb-fill { animation: rb-lit 10s linear infinite; animation-delay: 8s; }

    @keyframes rb-move {
      0%, 14% { transform: translateX(0); }
      20%, 34% { transform: translateX(75px); }
      40%, 54% { transform: translateX(150px); }
      60%, 74% { transform: translateX(225px); }
      80%, 100% { transform: translateX(300px); }
    }
    @keyframes rb-fade {
      0% { opacity: 0; }
      3%, 93% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes rb-lit {
      0%, 16% { fill: #4a9df8; }
      19%, 100% { fill: #3a3a3e; }
    }
    @keyframes rb-star {
      0%, 2% { opacity: 0; transform: scale(0.4); }
      6%, 16% { opacity: 1; transform: scale(1); }
      20%, 100% { opacity: 0; transform: scale(0.6); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rb-lens, .rb-star,
      .rb-p1 .rb-fill, .rb-p2 .rb-fill, .rb-p3 .rb-fill, .rb-p4 .rb-fill, .rb-p5 .rb-fill { animation: none; }
      .rb-lens { transform: translateX(225px); opacity: 1; }
      .rb-p4 .rb-fill { fill: #4a9df8; }
      .rb-star { opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="479" height="179" rx="10" fill="#141416" stroke="#2a2a2c"/>

  <rect x="20" y="18" width="16" height="16" rx="4" fill="#0070f3"/>
  <text x="28" y="30.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#ffffff">R</text>
  <text x="46" y="30.5" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="3.5" fill="#9a9aa2">RECRUITER</text>

  <g class="rb-p1">
    <circle class="rb-fill" cx="90" cy="88" r="11"/>
    <path class="rb-fill" d="M72 132q0-26 18-26q18 0 18 26z"/>
    <rect class="rb-barbg" x="73" y="140" width="34" height="5" rx="2.5"/>
    <rect class="rb-bar" x="73" y="140" width="14" height="5" rx="2.5"/>
  </g>
  <g class="rb-p2">
    <circle class="rb-fill" cx="165" cy="88" r="11"/>
    <path class="rb-fill" d="M147 132q0-26 18-26q18 0 18 26z"/>
    <rect class="rb-barbg" x="148" y="140" width="34" height="5" rx="2.5"/>
    <rect class="rb-bar" x="148" y="140" width="22" height="5" rx="2.5"/>
  </g>
  <g class="rb-p3">
    <circle class="rb-fill" cx="240" cy="88" r="11"/>
    <path class="rb-fill" d="M222 132q0-26 18-26q18 0 18 26z"/>
    <rect class="rb-barbg" x="223" y="140" width="34" height="5" rx="2.5"/>
    <rect class="rb-bar" x="223" y="140" width="10" height="5" rx="2.5"/>
  </g>
  <g class="rb-p4">
    <circle class="rb-fill" cx="315" cy="88" r="11"/>
    <path class="rb-fill" d="M297 132q0-26 18-26q18 0 18 26z"/>
    <rect class="rb-barbg" x="298" y="140" width="34" height="5" rx="2.5"/>
    <rect class="rb-bar rb-bar--top" x="298" y="140" width="31" height="5" rx="2.5"/>
  </g>
  <g class="rb-p5">
    <circle class="rb-fill" cx="390" cy="88" r="11"/>
    <path class="rb-fill" d="M372 132q0-26 18-26q18 0 18 26z"/>
    <rect class="rb-barbg" x="373" y="140" width="34" height="5" rx="2.5"/>
    <rect class="rb-bar" x="373" y="140" width="18" height="5" rx="2.5"/>
  </g>

  <path class="rb-star" d="M338 52l2.9 6.2 6.8.9-5 4.7 1.3 6.7-6-3.3-6 3.3 1.3-6.7-5-4.7 6.8-.9z" fill="#e8b93d"/>

  <g class="rb-lens">
    <circle cx="90" cy="90" r="26" fill="rgba(0,112,243,0.10)" stroke="#0070f3" stroke-width="4"/>
    <line x1="109" y1="109" x2="124" y2="124" stroke="#0070f3" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
