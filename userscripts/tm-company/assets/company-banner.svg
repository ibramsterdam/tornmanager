<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-label="Company income growing">
  <style>
    .cb-wall { fill: #2c2c30; }
    .cb-roof { fill: #3a3a3e; }
    .cb-win { fill: #3f3f45; }
    .cb-bar { fill: #3f3f45; transform-box: fill-box; transform-origin: bottom; animation: cb-grow 10s ease-out infinite; }
    .cb-bar--top { fill: #10b981; }
    .cb-b2 { animation-delay: 0.3s; }
    .cb-b3 { animation-delay: 0.6s; }
    .cb-b4 { animation-delay: 0.9s; }
    .cb-b5 { animation-delay: 1.2s; }
    .cb-b6 { animation-delay: 1.5s; }
    .cb-line { fill: none; stroke: #34d399; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: cb-draw 10s ease-in-out infinite; }
    .cb-dot { fill: #34d399; opacity: 0; animation: cb-dot 10s linear infinite; }
    .cb-coin { opacity: 0; transform-box: fill-box; transform-origin: center; animation: cb-coin 10s ease-out infinite; }
    .cb-w1 { animation: cb-lit 10s steps(1) infinite; }
    .cb-w2 { animation: cb-lit 10s steps(1) infinite; animation-delay: 0.8s; }
    .cb-w3 { animation: cb-lit 10s steps(1) infinite; animation-delay: 1.6s; }
    .cb-w4 { animation: cb-lit 10s steps(1) infinite; animation-delay: 2.4s; }
    .cb-w5 { animation: cb-lit 10s steps(1) infinite; animation-delay: 3.2s; }
    .cb-w6 { animation: cb-lit 10s steps(1) infinite; animation-delay: 4s; }

    @keyframes cb-grow {
      0% { transform: scaleY(0); }
      10%, 86% { transform: scaleY(1); }
      94%, 100% { transform: scaleY(0); }
    }
    @keyframes cb-draw {
      0%, 22% { stroke-dashoffset: 260; opacity: 1; }
      42%, 86% { stroke-dashoffset: 0; opacity: 1; }
      94%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes cb-dot {
      0%, 41% { opacity: 0; }
      43%, 86% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes cb-coin {
      0%, 43% { opacity: 0; transform: translateY(8px) scale(0.4); }
      48% { opacity: 1; transform: translateY(0) scale(1.15); }
      52%, 84% { opacity: 1; transform: translateY(0) scale(1); }
      92%, 100% { opacity: 0; transform: translateY(-6px) scale(0.8); }
    }
    @keyframes cb-lit {
      0% { fill: #3f3f45; }
      8% { fill: #6ee7b7; }
      70% { fill: #3f3f45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cb-bar, .cb-line, .cb-dot, .cb-coin,
      .cb-w1, .cb-w2, .cb-w3, .cb-w4, .cb-w5, .cb-w6 { animation: none; }
      .cb-bar { transform: none; }
      .cb-line { stroke-dashoffset: 0; }
      .cb-dot, .cb-coin { opacity: 1; }
      .cb-w2, .cb-w5 { fill: #6ee7b7; }
    }
  </style>

  <rect x="0.5" y="0.5" width="479" height="179" rx="10" fill="#141416" stroke="#2a2a2c"/>

  <rect x="20" y="18" width="16" height="16" rx="4" fill="#10b981"/>
  <text x="28" y="30.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#ffffff">C</text>
  <text x="46" y="30.5" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="3.5" fill="#9a9aa2">COMPANY</text>

  <line x1="30" y1="150.5" x2="450" y2="150.5" stroke="#2a2a2c" stroke-width="1"/>

  <path class="cb-roof" d="M44 76l52-22l52 22z"/>
  <rect class="cb-wall" x="50" y="76" width="92" height="74" rx="2"/>
  <rect class="cb-win cb-w1" x="60" y="86" width="16" height="12" rx="2"/>
  <rect class="cb-win cb-w4" x="88" y="86" width="16" height="12" rx="2"/>
  <rect class="cb-win cb-w2" x="116" y="86" width="16" height="12" rx="2"/>
  <rect class="cb-win cb-w5" x="60" y="106" width="16" height="12" rx="2"/>
  <rect class="cb-win cb-w3" x="116" y="106" width="16" height="12" rx="2"/>
  <rect class="cb-win cb-w6" x="60" y="126" width="16" height="12" rx="2"/>
  <rect class="cb-win" x="116" y="126" width="16" height="12" rx="2"/>
  <rect x="88" y="124" width="16" height="26" rx="2" fill="#10b981" opacity="0.85"/>

  <rect class="cb-bar cb-b1" x="200" y="120" width="26" height="30" rx="3"/>
  <rect class="cb-bar cb-b2" x="242" y="108" width="26" height="42" rx="3"/>
  <rect class="cb-bar cb-b3" x="284" y="112" width="26" height="38" rx="3"/>
  <rect class="cb-bar cb-b4" x="326" y="94" width="26" height="56" rx="3"/>
  <rect class="cb-bar cb-b5" x="368" y="80" width="26" height="70" rx="3"/>
  <rect class="cb-bar cb-bar--top cb-b6" x="410" y="58" width="26" height="92" rx="3"/>

  <polyline class="cb-line" points="213,112 255,100 297,104 339,86 381,72 423,50"/>
  <circle class="cb-dot" cx="423" cy="50" r="3.5"/>

  <g class="cb-coin">
    <circle cx="423" cy="30" r="11" fill="#e8b93d"/>
    <circle cx="423" cy="30" r="8" fill="none" stroke="#c99a24" stroke-width="1.5"/>
    <text x="423" y="34.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" fill="#7a5a10">$</text>
  </g>
</svg>
