default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Owner API queue: uses the application owner's Torn API key.
    # Single thread ensures sequential execution. Combined with TornApiJob's
    # 1.0s sleep after each job and the 1.1s polling_interval, this limits
    # throughput to ~28 req/min (well under the 50 req/min target).
    - queues: owner_api
      threads: 1
      processes: 1
      polling_interval: 1.1
    # Faction polling queue: war status polling using each faction's own API key.
    # Multiple threads to support concurrent polling for multiple factions.
    # Fast polling interval (0.5s) for 6-second responsiveness.
    - queues: faction_polling
      threads: 3
      processes: 1
      polling_interval: 0.5
    # Default queue for all other jobs (explicitly named to avoid picking up owner_api)
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
