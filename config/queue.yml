default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # torn_api thread count is a RATE LIMIT, not a performance knob:
    # each thread sustains ~40 Torn API calls/min (1 call + 1s pacing sleep),
    # so aggregate outbound throughput ≈ threads × 40/min from this server's
    # IP. TornApi::RateLimiter caps 50/min per key and 300/min globally on
    # top — keep threads × 40 comfortably under the global budget.
    # (faction/admin are drained legacy queue names; remove after deploy settles.)
    - queues: [ torn_api, faction, admin ]
      threads: 5
      processes: 1
      polling_interval: 0.5
    - queues: war
      threads: 3
      processes: 1
      polling_interval: 0.5
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
