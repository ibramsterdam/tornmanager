default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: admin
      threads: 1
      processes: 1
      polling_interval: 1.1
    - queues: faction
      threads: 5
      processes: 1
      polling_interval: 0.5
    - queues: war
      threads: 3
      processes: 1
      polling_interval: 0.5
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
