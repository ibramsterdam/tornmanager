# Note: Production server runs in UTC (same as TCT).
# Torn updates personal stats cache between midnight and 1am TCT.

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: at 12am every day
  # daily_stock_dividend_job:
  #   class: Daily::StockDividendJob
  #   queue: default
  #   schedule: at 11am every day
  data_retention_cleanup:
    class: Daily::DataRetentionCleanupJob
    queue: default
    schedule: at 12am every day
  faction_member_sync:
    class: Daily::FactionMemberSyncJob
    queue: default
    schedule: at 2:30am every day
  hof_member_sync:
    class: Daily::HofMemberSyncJob
    queue: default
    schedule: at 3am every day
  ranked_war_refresh:
    class: Daily::RankedWarRefreshJob
    queue: default
    schedule: at 2am every day
  fetch_xanax_payments:
    class: Daily::XanaxPaymentsJob
    queue: default
    schedule: at 4am every day
  validate_faction_keys:
    class: Daily::ValidateFactionKeysJob
    queue: default
    schedule: at 1am every day
  armory_news_sync:
    class: Daily::ArmoryNewsJob
    queue: default
    schedule: at 5am every day
  member_activity_poll:
    class: MemberActivityPollJob
    queue: default
    schedule: every 15 minutes
  recruiter_sync_roster:
    class: Recruiter::SyncRosterJob
    queue: torn_api
    schedule: at 5:30am every day
  recruiter_sweep_working_stats:
    class: Recruiter::SweepWorkingStatsJob
    queue: torn_api
    schedule: at 6am every day
  recruiter_backfill_missing_stats:
    class: Recruiter::BackfillMissingStatsJob
    queue: default
    schedule: at 6:30am every day
